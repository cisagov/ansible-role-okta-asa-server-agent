  # - cgroupns_mode: host
  #   command: /lib/systemd/systemd
  #   image: docker.io/geerlingguy/docker-fedora38-ansible:latest
  #   name: fedora38-systemd
  #   platform: amd64
  #   pre_build_image: true
  #   privileged: true
